<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#131B36"/>
      <stop offset="100%" stop-color="#0B1F33"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0.15" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0.88" cy="0.82" r="0.6">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    /*FONTS*/
    .eyebrow {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.6px;
      fill: #38BDF8;
    }
    .title {
      font-family: 'Montserrat', 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: #F8FAFC;
    }
    .subtitle {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #CBD5E1;
    }
    .tag {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #E2E8F0;
    }
  </style>

  <rect width="850" height="220" rx="16" fill="url(#bg-grad)"/>
  <rect width="850" height="220" rx="16" fill="url(#grid)"/>
  <rect width="850" height="220" rx="16" fill="url(#glow-left)"/>
  <rect width="850" height="220" rx="16" fill="url(#glow-right)"/>
  <rect x="0.75" y="0.75" width="848.5" height="218.5" rx="15.25" stroke="url(#accent-grad)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top accent bar -->
  <rect x="44" y="34" width="44" height="4" rx="2" fill="url(#accent-grad)"/>
  <text x="100" y="40" class="eyebrow">HELLO, WORLD · @VNZ626</text>

  <!-- Main name & role -->
  <text x="44" y="108" class="title">Kevin Beding</text>
  <text x="44" y="140" class="subtitle">S1 Teknologi Informasi UNY · UI/UX &amp; Fullstack Learner</text>

  <!-- Bottom pills -->
  <rect x="44" y="164" width="112" height="28" rx="14" fill="#1E293B" stroke="#7C4DFF" stroke-opacity="0.5"/>
  <text x="100" y="182" text-anchor="middle" class="tag">UI/UX Design</text>

  <rect x="166" y="164" width="118" height="28" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.5"/>
  <text x="225" y="182" text-anchor="middle" class="tag">Fullstack Dev</text>

  <rect x="294" y="164" width="120" height="28" rx="14" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5"/>
  <text x="354" y="182" text-anchor="middle" class="tag">S1 TI · UNY</text>

  <!-- Decorative geometric mark on right -->
  <g opacity="0.9">
    <circle cx="766" cy="96" r="42" stroke="url(#accent-grad)" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="766" cy="96" r="24" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.65"/>
    <circle cx="766" cy="96" r="6" fill="url(#accent-grad)"/>
  </g>
</svg>

