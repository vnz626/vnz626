<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 56" width="850" height="56" fill="none">
  <style>
    /*FONTS*/
    .num {
      font-family: 'Montserrat', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #71717A;
    }
    .heading {
      font-family: 'Montserrat', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
      font-size: 28px;
      fill: #18181B;
    }
    .line-bg { fill: #D4D4D8; }
    .line-accent { fill: #27272A; }
    @media (prefers-color-scheme: dark) {
      .num { fill: #A1A1AA; }
      .heading { fill: #F4F4F5; }
      .line-bg { fill: #27272A; }
      .line-accent { fill: #E4E4E7; }
    }
  </style>
  <text x="0" y="34" class="num">01</text>
  <text x="46" y="35" class="heading">Tentang Saya</text>
  <rect x="0" y="49" width="850" height="1.5" rx="0.75" class="line-bg"/>
  <rect x="0" y="48.5" width="112" height="2.5" rx="1.25" class="line-accent"/>
</svg>
