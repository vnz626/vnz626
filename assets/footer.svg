<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="850" height="64" fill="none">
  <style>
    /*FONTS*/
    .line { fill: #D4D4D8; }
    .footer-text {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #71717A;
    }
